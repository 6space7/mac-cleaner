name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the artifact. Defaults to the short commit SHA.
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT: mac-cleaner.xcodeproj
  SCHEME: mac-cleaner
  CONFIGURATION: Release
  APP_NAME: mac-cleaner
  DERIVED_DATA: build/DerivedData

jobs:
  package:
    name: Package macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare signing keychain
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete. Building an unsigned zip."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mac-cleaner-signing.keychain-db"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F\" '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity found in imported certificate." >&2
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build release app
        env:
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "$SIGNING_AVAILABLE" == "true" ]]; then
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              ENABLE_HARDENED_RUNTIME=YES \
              build
          else
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -derivedDataPath "$DERIVED_DATA" \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Package zip
        id: package
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIGURATION/$APP_NAME.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Could not find app bundle at $APP_PATH" >&2
            exit 1
          fi

          ZIP_PATH="$RUNNER_TEMP/Mac-Cleaner-${{ steps.version.outputs.value }}.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "app=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple
        id: notarize
        env:
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "$SIGNING_AVAILABLE" != "true" || -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "Notarization secrets are incomplete. Keeping the unsigned or signed-only zip."
            exit 0
          fi

          xcrun notarytool submit "${{ steps.package.outputs.zip }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "${{ steps.package.outputs.app }}"

          NOTARIZED_ZIP="$RUNNER_TEMP/Mac-Cleaner-${{ steps.version.outputs.value }}-notarized.zip"
          ditto -c -k --keepParent "${{ steps.package.outputs.app }}" "$NOTARIZED_ZIP"
          echo "zip=$NOTARIZED_ZIP" >> "$GITHUB_OUTPUT"
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Cleaner-${{ steps.version.outputs.value }}
          path: ${{ steps.notarize.outputs.zip || steps.package.outputs.zip }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ZIP: ${{ steps.notarize.outputs.zip || steps.package.outputs.zip }}
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
        run: |
          set -euo pipefail
          NOTES="Mac Cleaner ${GITHUB_REF_NAME}"
          if [[ "$NOTARIZED" == "true" ]]; then
            NOTES="$NOTES"$'\n\n'"This zip contains a signed, notarized, and stapled app bundle."
          else
            NOTES="$NOTES"$'\n\n'"Signing/notarization secrets were missing or incomplete, so this zip is not notarized."
          fi

          gh release create "$GITHUB_REF_NAME" "$RELEASE_ZIP" \
            --title "Mac Cleaner $GITHUB_REF_NAME" \
            --notes "$NOTES" \
            --latest

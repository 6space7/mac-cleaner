name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the artifact. Defaults to the short commit SHA.
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT: mac-cleaner.xcodeproj
  SCHEME: mac-cleaner
  CONFIGURATION: Release
  APP_NAME: mac-cleaner
  DERIVED_DATA: build/DerivedData

jobs:
  package:
    name: Package macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare signing keychain
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete. Building an unsigned zip."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mac-cleaner-signing.keychain-db"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F\" '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity found in imported certificate." >&2
            exit 1
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build notarized DMGs
        id: package
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail

          ASSET_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$ASSET_DIR"

          notarization_available() {
            [[ "$SIGNING_AVAILABLE" == "true" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]
          }

          notarize_file() {
            local file_path="$1"
            local label="$2"
            local json_path="$RUNNER_TEMP/notary-${label}.json"
            local log_path="$RUNNER_TEMP/notary-${label}-log.json"

            xcrun notarytool submit "$file_path" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait \
              --output-format json > "$json_path"

            local status
            local submission_id
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$json_path")"
            submission_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$json_path")"
            if [[ "$status" != "Accepted" ]]; then
              echo "Notarization for $label finished with status: $status" >&2
              if [[ -n "$submission_id" ]]; then
                xcrun notarytool log "$submission_id" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" \
                  "$log_path" || true
                cat "$log_path" || true
              fi
              exit 1
            fi
          }

          build_arch_dmg() {
            local arch="$1"
            local label="$2"
            local display="$3"
            local derived_data="$RUNNER_TEMP/DerivedData-$label"
            local app_path="$derived_data/Build/Products/$CONFIGURATION/$APP_NAME.app"
            local dmg_staging="$RUNNER_TEMP/dmg-staging-$label"
            local dmg_path="$ASSET_DIR/Mac-Cleaner-$VERSION-$label.dmg"

            if [[ "$SIGNING_AVAILABLE" == "true" ]]; then
              xcodebuild \
                -project "$PROJECT" \
                -scheme "$SCHEME" \
                -configuration "$CONFIGURATION" \
                -destination "generic/platform=macOS" \
                -derivedDataPath "$derived_data" \
                ARCHS="$arch" \
                ONLY_ACTIVE_ARCH=NO \
                CODE_SIGN_STYLE=Manual \
                CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
                DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
                CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
                ENABLE_HARDENED_RUNTIME=YES \
                OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
                build
            else
              xcodebuild \
                -project "$PROJECT" \
                -scheme "$SCHEME" \
                -configuration "$CONFIGURATION" \
                -destination "generic/platform=macOS" \
                -derivedDataPath "$derived_data" \
                ARCHS="$arch" \
                ONLY_ACTIVE_ARCH=NO \
                CODE_SIGNING_ALLOWED=NO \
                build
            fi

            if [[ ! -d "$app_path" ]]; then
              echo "Could not find app bundle at $app_path" >&2
              exit 1
            fi

            if notarization_available; then
              codesign --verify --deep --strict --verbose=2 "$app_path"
              local app_zip="$RUNNER_TEMP/Mac-Cleaner-$VERSION-$label-app.zip"
              ditto -c -k --keepParent "$app_path" "$app_zip"
              notarize_file "$app_zip" "$label-app"
              xcrun stapler staple "$app_path"
            fi

            rm -rf "$dmg_staging"
            mkdir -p "$dmg_staging"
            cp -R "$app_path" "$dmg_staging/"
            ln -s /Applications "$dmg_staging/Applications"
            hdiutil create \
              -volname "Mac Cleaner $VERSION $display" \
              -srcfolder "$dmg_staging" \
              -ov \
              -format UDZO \
              "$dmg_path"

            if notarization_available; then
              notarize_file "$dmg_path" "$label-dmg"
              xcrun stapler staple "$dmg_path"
            fi
          }

          build_arch_dmg "arm64" "apple-silicon" "Apple Silicon"
          build_arch_dmg "x86_64" "intel" "Intel"

          if notarization_available; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
          echo "asset_dir=$ASSET_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mac-Cleaner-${{ steps.version.outputs.value }}
          path: ${{ steps.package.outputs.asset_dir }}/*.dmg

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_DIR: ${{ steps.package.outputs.asset_dir }}
          NOTARIZED: ${{ steps.package.outputs.notarized }}
        run: |
          set -euo pipefail
          NOTES="Mac Cleaner ${GITHUB_REF_NAME}"
          if [[ "$NOTARIZED" == "true" ]]; then
            NOTES="$NOTES"$'\n\n'"Includes signed, notarized, and stapled DMGs for Apple Silicon and Intel Macs."
          else
            NOTES="$NOTES"$'\n\n'"Signing/notarization secrets were missing or incomplete, so these DMGs are not notarized."
          fi

          gh release create "$GITHUB_REF_NAME" "$ASSET_DIR"/*.dmg \
            --title "Mac Cleaner $GITHUB_REF_NAME" \
            --notes "$NOTES" \
            --latest
